name: offpage
on:
  workflow_dispatch:
    inputs:
      site:
        description: "site id, or all"
        default: "all"
  schedule:
    - cron: "30 3 * * 1"   # every Monday 09:00 IST: plans and drafts only, contacts nobody, changes no site
permissions: {contents: read}
jobs:
  offpage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m seo_agent.offpage "${{ github.event.inputs.site || 'all' }}"
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: without it the template drafts are used
