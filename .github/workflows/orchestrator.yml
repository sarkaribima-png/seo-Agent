name: seo-orchestrator
on:
  schedule: [{cron: "0 4 * * 1"}]       # every Monday 09:30 IST: after tech-audit and report (08:00 IST) have written their tables
  workflow_dispatch:
    inputs:
      site:
        description: "site id, or all"
        default: "all"
permissions: {contents: read}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Weekly Action Plan
        run: python -m seo_agent.orchestrator "${{ github.event.inputs.site || 'all' }}"
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
