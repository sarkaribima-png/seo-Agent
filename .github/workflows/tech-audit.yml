name: tech-audit
on:
  workflow_dispatch:
    inputs:
      site:
        description: "site id, or all"
        default: "all"
  schedule:
    - cron: "30 2 * * 1"   # every Monday 08:00 IST (read-only audit, changes nothing on any site)
permissions: {contents: read}
jobs:
  tech:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m seo_agent.tech_audit "${{ github.event.inputs.site || 'all' }}"
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}   # optional: without it Core Web Vitals are skipped
