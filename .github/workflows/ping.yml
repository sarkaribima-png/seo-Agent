name: bridge-ping
on: workflow_dispatch
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping plugin
        env:
          U: ${{ secrets.KALOSA_WP_USER }}
          P: ${{ secrets.KALOSA_WP_APP_PASSWORD }}
        run: |
          echo "--- audit tummy tuck (777)"
          curl -s -u "$U:$P" https://www.kalosa.in/wp-json/seo-agent/v1/audit/777 | python3 -c "import sys,json; d=json.load(sys.stdin); d.pop('headings',None); print(json.dumps(d,indent=1))"
          echo "--- audit BBL (2535)"
          curl -s -u "$U:$P" https://www.kalosa.in/wp-json/seo-agent/v1/audit/2535 | python3 -c "import sys,json; d=json.load(sys.stdin); d.pop('headings',None); print(json.dumps(d,indent=1))"
          echo "--- missing meta"
          curl -s -u "$U:$P" https://www.kalosa.in/wp-json/seo-agent/v1/missing-meta | python3 -c "import sys,json; d=json.load(sys.stdin); print('count:',d['count']); [print(i['url']) for i in d['items'][:12]]"
