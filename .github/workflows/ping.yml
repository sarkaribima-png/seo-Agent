name: bridge-ping
on: workflow_dispatch
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping plugin
        env:
          U: ${{ secrets.KALOSA_WP_USER }}
          P: ${{ secrets.KALOSA_WP_APP_PASSWORD }}
        run: |
          echo "--- who am I (standard WordPress endpoint)"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -u "$U:$P" https://www.kalosa.in/wp-json/wp/v2/users/me
          curl -s -u "$U:$P" https://www.kalosa.in/wp-json/wp/v2/users/me | head -c 300; echo
          echo "--- ping"; curl -s -u "$U:$P" https://www.kalosa.in/wp-json/seo-agent/v1/ping; echo
          echo "--- username length: ${#U}, password length: ${#P}"
