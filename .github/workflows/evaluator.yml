name: evaluator
on:
  schedule: [{cron: "30 5 * * 1"}]      # every Monday 11:00 IST: after tech-audit, report (08:00 IST) and the orchestrator (09:30 IST) have written their tables
  workflow_dispatch:
    inputs:
      site:
        description: "site id, or all"
        default: "all"
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Weekly scorecards
        run: python -m seo_agent.evaluator "${{ github.event.inputs.site || 'all' }}" --print
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
