name: track-rankings
on:
  workflow_dispatch:
    inputs:
      site:
        description: "site id"
        default: "kalosa"
  schedule:
    - cron: "0 4 * * *"   # 09:30 IST daily
permissions: {contents: read}
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m seo_agent.track "${{ github.event.inputs.site || 'kalosa' }}"
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          KALOSA_WP_USER: ${{ secrets.KALOSA_WP_USER }}
          KALOSA_WP_APP_PASSWORD: ${{ secrets.KALOSA_WP_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
