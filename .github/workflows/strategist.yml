name: seo-strategist
on:
  schedule: [{cron: "30 4 * * *"}]       # daily 10:00 IST, after the daily gsc pull has filled gsc_daily
  workflow_dispatch:
    inputs:
      site:
        description: "site id, or all"
        default: "all"
permissions: {contents: read}
jobs:
  strategist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Follow up on applied changes (day 3 / 14 / 28)
        run: python -m seo_agent.strategist "${{ github.event.inputs.site || 'all' }}"
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
