name: publisher
on:
  schedule: [{cron: "17 * * * *"}]      # hourly; the code publishes only inside the site's IST window and never above the daily cap
  workflow_dispatch:
    inputs:
      site:
        description: "site id, or all"
        default: "all"
permissions: {contents: read}
concurrency: {group: publisher, cancel-in-progress: false}   # two runs at once could both pass the cap check
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Publish + index checks
        run: python -m seo_agent.publisher "${{ github.event.inputs.site || 'all' }}"
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
